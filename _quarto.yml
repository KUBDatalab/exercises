project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - '*.qmd'
    - 'r/**/*.qmd'
    - 'python/**/*.qmd'
    - 'sql/**/*.qmd'
    - 'vejledning/*.qmd'
    - '!templates/'
    - '!scripts/'
  resources:
    - assets/
    - data/
website:
  title: 'KUB Datalab · Øvelser'
  site-url: https://kubdatalab.github.io/exercises/
  description: 'Øv dig videre efter KUB Datalabs kurser. Små opgaver, hints og feedback i dit eget tempo.'
  favicon: assets/kub-datalab.svg
  bread-crumbs: true
  navbar:
    logo: assets/kub-datalab.svg
    logo-alt: KUB Datalab
    title: 'KUB Datalab'
    background: light
    left:
      - text: Øvelser i R
        href: r/index.qmd
      - text: Python
        href: python/index.qmd
      - text: SQL
        href: sql/index.qmd
      - text: Demo-øvelser
        href: demo-oevelser.qmd
      - text: Til undervisere
        href: vejledning/ny-oevelsesside.qmd
    right:
      - text: Om sitet
        href: om.qmd
      - icon: github
        href: https://github.com/KUBDatalab/exercises
        aria-label: Kildekode på GitHub
  sidebar:
  - id: r
    title: Øvelser i R
    style: docked
    contents:
    - r/index.qmd
    - section: Introduktion til R
      contents:
      - r/intro/index.qmd
      - r/intro/vektorer.qmd
      - r/intro/data.qmd
    - section: Eksplorativ dataanalyse
      contents:
      - r/eda/index.qmd
      - r/eda/undersoeg-data.qmd
    - section: Visualisering med R
      contents:
      - r/visualisering/index.qmd
      - r/visualisering/lag-og-mapping.qmd
      - r/visualisering/facetter-og-skalaer.qmd
    - section: Statistik med R
      contents:
      - r/statistik/index.qmd
      - r/statistik/fordelinger.qmd
      - r/statistik/regression.qmd
    - section: Tekstanalyse med R
      contents:
      - r/tekstanalyse/index.qmd
      - r/tekstanalyse/ord-og-sentiment.qmd
    - section: API’er med R
      contents:
      - r/api/index.qmd
      - r/api/forespoergsler-og-json.qmd
    - section: Web scraping med R
      contents:
      - r/webscraping/index.qmd
      - r/webscraping/html-og-tabeller.qmd
    - section: Programmering i R
      contents:
      - r/programmering/index.qmd
      - r/programmering/funktioner-og-loekker.qmd
    - section: R-toolbox
      contents:
      - r/toolbox/index.qmd
      - r/toolbox/import-og-reproducerbarhed.qmd
      - r/toolbox/tabeller.qmd
      - r/toolbox/modeller.qmd
      - r/toolbox/power-og-clt.qmd
      - r/toolbox/klynger.qmd
      - r/toolbox/enighed.qmd
      - r/toolbox/beregning-og-miljoe.qmd
  - id: python
    title: Øvelser i Python
    style: docked
    contents:
    - python/index.qmd
    - section: Python for Absolute Beginners
      contents:
      - python/intro/index.qmd
      - python/intro/grundlag.qmd
    - section: Python for not quite Absolute Beginners
      contents:
      - python/videre/index.qmd
      - python/videre/funktioner-og-fejl.qmd
    - section: Dataanalyse med pandas
      contents:
      - python/pandas/index.qmd
      - python/pandas/tabeller.qmd
    - section: Python-toolbox
      contents:
      - python/tekst/index.qmd
      - python/tekst/regex-og-frekvens.qmd
  - id: sql
    title: Øvelser i SQL
    style: docked
    contents:
    - sql/index.qmd
    - section: Introduktion til SQL
      contents:
      - sql/intro/index.qmd
      - sql/intro/forespoergsler.qmd
      - sql/intro/joins-og-noegler.qmd
  - id: underviser
    title: Til undervisere
    contents:
    - vejledning/ny-oevelsesside.qmd
    - vejledning/kursusoverblik.qmd
    - demo-oevelser.qmd
    - vejledning/statistik.qmd
  page-footer:
    left: 'KUB Datalab · Københavns Universitetsbibliotek'
    right:
      - text: Om sitet og statistik
        href: om.qmd
      - text: Lav en øvelsesside
        href: vejledning/ny-oevelsesside.qmd
  search:
    location: navbar
    type: overlay
engine: knitr
format:
  live-html:
    webr:
      engine-url: https://webr.r-wasm.org/v0.6.0/
      resources: []
      cell-options:
        autorun: false
        persist: false
        timelimit: 30
    pyodide:
      engine-url: https://cdn.jsdelivr.net/pyodide/v0.28.1/full/
      resources: []
      cell-options:
        autorun: false
        persist: false
        timelimit: 30
    theme: [cosmo, assets/theme.scss]
    css: [assets/vendor/webex.css, assets/site.css]
    include-after-body: [assets/vendor/webex.js, assets/site-includes.html]
    toc: true
    toc-title: På denne side
    code-copy: true
    code-overflow: wrap
    lang: da
    anchor-sections: true
execute:
  warning: false
  message: false
  freeze: false
