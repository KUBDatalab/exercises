name: Build and publish Quarto site
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: quarto-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.1'
          use-public-rspm: true
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: '1.7.32'
      - name: Install R dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("remotes", "knitr", "rmarkdown"))
          remotes::install_version("webexercises", version = "1.2.0", upgrade = "never")
          stopifnot(as.character(packageVersion("webexercises")) == "1.2.0")
      - name: Render website
        run: quarto render
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test tools
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Check links and exercise interactions
        run: node tests/site.test.mjs
      - name: Save website and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quarto-site-and-checks
          path: |
            _site/
            test-results/
          retention-days: 14
      - name: Publish to this repository only
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          publish_branch: gh-pages
          enable_jekyll: false
